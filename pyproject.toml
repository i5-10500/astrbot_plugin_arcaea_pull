[project]
name = "astrbot-plugin-arcaea-pull"
version = "0.3.0"
description = "Arcaea China APK update and download infrastructure for AstrBot"
authors = [{ name = "i5-10500" }]
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.9,<4",
  "tzdata>=2024.1; platform_system == 'Windows'",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
